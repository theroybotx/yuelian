<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录约练</title><link rel="icon" type="image/svg+xml" href="/mark.svg"><link rel="stylesheet" href="/style.css?v=trial1"><link rel="stylesheet" href="/login.css?v=trial1"></head>
<body class="login-body"><main class="login-shell"><a href="/" class="brand login-brand" aria-label="约练主页">约练<span>YUELIAN TENNIS</span></a><div class="login-heading"><p class="overline">COURTSIDE / YOUR ACCOUNT</p><h1 id="login-title">欢迎回到球场。</h1><p class="sub">登录约练，接着安排下一场。</p></div><div id="account-status" role="status"></div>
<section class="login-panel" aria-labelledby="login-title"><form id="login-form"><label for="username">约练用户名</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" autocapitalize="none" spellcheck="false" aria-describedby="username-hint"><p class="field-hint" id="username-hint">使用管理员提供的试用账号。</p><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"><p id="login-error" class="login-error" role="alert" tabindex="-1" hidden></p><button type="submit" class="btn primary login-submit">登录约练</button></form></section>
<p class="login-footnote">当前为邀请试用。需要新账号或重置密码，请联系管理员。</p></main><script type="module" src="/login.js?v=trial1"></script></body></html>
